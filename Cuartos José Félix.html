<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuartos José Félix</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#14211d;--mut:#5d6b66;--line:#d5ddd9;--g:#24403a;--ok:#1a7a4c;--warn:#b45309;--bad:#b3261e;--info:#1d5fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18251f;--ink:#e8efeb;--mut:#9fb0a9;--line:#2c3d36;--g:#2f5a4f;--ok:#5fcf97;--warn:#f0a85a;--bad:#ff8a80;--info:#7fb6f2}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18251f;--ink:#e8efeb;--mut:#9fb0a9;--line:#2c3d36;--g:#2f5a4f;--ok:#5fcf97;--warn:#f0a85a;--bad:#ff8a80;--info:#7fb6f2}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 "Public Sans",system-ui,sans-serif;min-height:100%}
main{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{background:var(--g);color:#fff;margin:0 -14px 16px;padding:18px 18px 16px}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 0;opacity:.8;font-size:14px}
h2{font-size:17px;margin:22px 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;margin:0}
.room:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.room b{display:block;font-size:17px}.room small{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{border-left:4px solid var(--g);padding-left:10px}.stat b{font-size:22px;display:block}.stat span{color:var(--mut);font-size:13px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;margin-top:6px}
.Pagado{color:var(--ok)}.Parcial,.Pendiente{color:var(--warn)}.Vencido{color:var(--bad)}.Revision{color:var(--info)}.Libre{color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,select{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{font:600 15px inherit;font-family:inherit;padding:11px 16px;border-radius:8px;border:0;background:var(--g);color:#fff;cursor:pointer;margin-top:10px}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 12px;margin:0 6px 0 0;font-size:13px}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.line:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.big{font-size:20px;font-weight:800}
.bar{display:flex;gap:10px;align-items:end}.bar>*{flex:1}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style></head><body><main>
<header><h1>Cuartos José Félix</h1><p>Alquileres, inquilinos y respaldos de pago</p></header>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s),v=id=>$('#'+id).value,pad=n=>String(n).padStart(2,'0');
const today=new Date().toISOString().slice(0,10);
const money=n=>'$'+(+n).toFixed(2);const uid=()=>Math.random().toString(36).slice(2,9);
let S=null,view='home',month=today.slice(0,7);
function blank(){return{rooms:[1,2,3,4,5,6].map(n=>({id:n,status:'por configurar',name:'',phone:'',canon:0,comp:0,dueDay:5,pays:[],proms:[],gTotal:0,cuotas:[]}))}}
try{S=JSON.parse(localStorage.getItem('focuslife_cuartos'))}catch(e){}
if(!S||!S.rooms)S=blank();
let db=null,assets=null;const ref=()=>db.doc('cuartos/main');
function save(){try{localStorage.setItem('focuslife_cuartos',JSON.stringify(S))}catch(e){}
 if(db)ref().set(JSON.parse(JSON.stringify(S))).catch(()=>alert('No se pudo guardar en la nube. Revisa tu conexión.'))}
async function init(){
 if(!window.claude)return;
 try{db=await claude.use('db')}catch(e){}
 try{assets=await claude.use('assets')}catch(e){}
 if(db)ref().onSnapshot(sn=>{
  if(sn.exists){if(!sn.metadata.hasPendingWrites){S=sn.data();const f=document.activeElement;if(!f||!/INPUT|SELECT/.test(f.tagName))render()}}
  else ref().set(JSON.parse(JSON.stringify(S))).catch(()=>{})},()=>{});
 render()}
const TIPOS=['Contrato de arrendamiento','Identificación','Comprobante de transferencia','Captura del banco','Foto de la habitación','Otro'];
async function upload(r,btn){
 const f=$('#d-file').files[0];if(!f)return alert('Elige un archivo o toma una foto.');
 if(!assets)return alert('Subir archivos solo funciona al abrir la app con tu cuenta de Claude.');
 btn.disabled=true;btn.textContent='Subiendo…';
 try{const u=await assets.upload(f);r.docs=r.docs||[];
  r.docs.push({id:uid(),asset:u.id,name:f.name,tipo:v('d-tipo'),month,date:today,note:v('d-note'),reviewed:false});save()}
 catch(e){alert('No se pudo subir: '+(e.message||'error'))}
 render()}
const room=id=>S.rooms.find(r=>r.id==id);
// Todo se calcula desde los movimientos; nada se guarda como total.
function calc(r,m){
 const net=Math.max(r.canon-r.comp,0),sum=st=>r.pays.filter(p=>p.month==m&&p.state==st).reduce((a,p)=>a+p.amount,0);
 const ver=sum('verificado'),rev=sum('revision'),due=m+'-'+pad(r.dueDay),pend=Math.max(net-ver,0);
 let st='Pendiente';
 if(r.status!='ocupada'||!net)st='Libre';
 else if(ver>=net)st='Pagado';
 else if(due<today)st='Vencido';
 else if(ver>0)st='Parcial';
 else if(rev>0)st='Revision';
 return{net,ver,rev,due,pend,st,label:{Revision:'En revisión',Libre:'Sin cobro'}[st]||st}}
const gRec=r=>r.cuotas.filter(c=>c.paid).reduce((a,c)=>a+c.amount,0);
function home(){
 let exp=0,ver=0,pend=0,occ=0;
 S.rooms.forEach(r=>{if(r.status=='ocupada')occ++;const c=calc(r,month);if(c.st!='Libre'){exp+=c.net;ver+=c.ver;pend+=c.pend}});
 return `<div class="card bar"><div><label for="mon">Mes</label><input id="mon" type="month" value="${month}" data-c="mon"></div><button class="b s" data-a="backup">Copiar respaldo</button></div>
 <div class="card stats"><div class="stat"><b>${occ} de 6</b><span>Ocupadas</span></div><div class="stat"><b>${money(exp)}</b><span>Neto esperado</span></div><div class="stat"><b>${money(ver)}</b><span>Recibido y verificado</span></div><div class="stat"><b>${money(pend)}</b><span>Por cobrar</span></div></div>
 <h2>Habitaciones</h2><div class="grid">${S.rooms.map(r=>{const c=calc(r,month);return `<button class="card room" data-a="open" data-id="${r.id}"><b>Cuarto ${r.id}</b><small>${r.name||'Por configurar'}</small><br><span class="chip ${c.st}">${c.label}</span>${c.st!='Libre'?`<br><small>Falta ${money(c.pend)}</small>`:''}</button>`}).join('')}</div>
 <p class="mut">Los datos y archivos se guardan en tu cuenta de Claude y se sincronizan entre tus dispositivos.</p>`}
function detail(r){
 const c=calc(r,month),pays=r.pays.filter(p=>p.month==month),proms=r.proms.filter(p=>p.month==month),rec=gRec(r);
 const sched=r.cuotas.reduce((a,x)=>a+x.amount,0);
 return `<button class="b s" data-a="back">‹ Volver</button><h2>Cuarto ${r.id} · <span class="${c.st}">${c.label}</span></h2>
 <div class="card"><h3>Alquiler de ${month}</h3>
 <div class="line"><span>Canon contractual</span><b>${money(r.canon)}</b></div>
 <div class="line"><span>Compensación (internet, etc.)</span><b>− ${money(r.comp)}</b></div>
 <div class="line"><span>Neto esperado · vence ${c.due}</span><b>${money(c.net)}</b></div>
 <div class="line"><span>Verificado</span><b>${money(c.ver)}</b></div>
 <div class="line"><span>En revisión (sin confirmar)</span><b>${money(c.rev)}</b></div>
 <div class="line"><span>Saldo pendiente</span><b class="big">${money(c.pend)}</b></div></div>
 <div class="card"><h3>Pagos recibidos</h3>${pays.length?pays.map(p=>`<div class="line"><span>${p.date} · ${p.method}<br><span class="mut">${p.note||''}</span></span><span><b>${money(p.amount)}</b><br>${p.state=='verificado'?'<span class="Pagado mut">Verificado</span>':`<button class="b s" data-a="verify" data-id="${p.id}">Verificar en banco</button>`}</span></div>`).join(''):'<p class="mut">Aún no hay pagos este mes.</p>'}
 <label>Nuevo pago</label><div class="row"><div><label for="p-amt">Monto</label><input id="p-amt" type="number" step="0.01"></div><div><label for="p-date">Fecha de recepción</label><input id="p-date" type="date" value="${today}"></div></div>
 <div class="row"><div><label for="p-method">Método</label><select id="p-method"><option>Transferencia</option><option>Efectivo</option><option>Otro</option></select></div><div><label for="p-note">Nota o transacción</label><input id="p-note"></div></div>
 <button class="b" data-a="addPay">Registrar pago (queda en revisión)</button></div>
 <div class="card"><h3>Promesas de pago</h3>${proms.length?proms.map(q=>`<div class="line"><span>Prometió ${money(q.amount)} para el ${q.date}<br><span class="mut">Registrada ${q.at}</span></span><span>${q.status=='pendiente'?`<button class="b s" data-a="prom" data-id="${q.id}" data-st="cumplida">Cumplida</button><button class="b s" data-a="prom" data-id="${q.id}" data-st="no cumplida">No cumplida</button>`:`<span class="mut">${q.status}</span>`}</span></div>`).join(''):'<p class="mut">Sin promesas este mes.</p>'}
 <div class="row"><div><label for="q-amt">Monto prometido</label><input id="q-amt" type="number" step="0.01"></div><div><label for="q-date">Fecha prometida</label><input id="q-date" type="date"></div></div>
 <button class="b" data-a="addProm">Guardar promesa</button><p class="mut">Una promesa nunca marca el alquiler como pagado ni borra el vencimiento original.</p></div>
 <div class="card"><h3>Garantía (separada del alquiler)</h3>
 <div class="line"><span>Acordada</span><b>${money(r.gTotal)}</b></div><div class="line"><span>Recibida</span><b>${money(rec)}</b></div><div class="line"><span>Saldo</span><b>${money(Math.max(r.gTotal-rec,0))}</b></div>
 ${r.cuotas.map((x,i)=>`<div class="line"><span>Cuota ${i+1} · ${money(x.amount)}<br><span class="mut">Fecha original ${x.due}${x.moves.map(m=>`<br>Reprogramada a ${m.to} (el ${m.at})`).join('')}</span></span><span>${x.paid?`<span class="Pagado">Pagada ${x.paid}</span>`:`<input id="cd-${x.id}" type="date" aria-label="Nueva fecha"><br><button class="b s" data-a="pay" data-id="${x.id}" data-k="cuota">Marcar pagada</button><button class="b s" data-a="move" data-id="${x.id}">Reprogramar</button>`}</span></div>`).join('')}
 ${r.gTotal>sched?`<p class="mut">Sin programar en cuotas: ${money(r.gTotal-sched)}</p>`:''}
 <div class="row"><div><label for="c-amt">Valor de cuota</label><input id="c-amt" type="number" step="0.01"></div><div><label for="c-due">Vence</label><input id="c-due" type="date"></div></div><button class="b" data-a="addCuota">Agregar cuota</button></div>
 <div class="card"><h3>Documentos y comprobantes</h3>
 ${(r.docs||[]).length?(r.docs).slice().reverse().map(d=>`<div class="line"><span><b>${d.tipo}</b>${d.tipo.startsWith('Comp')||d.tipo.startsWith('Captura')?' · '+d.month:''}<br><span class="mut">${d.name} · subido ${d.date}${d.note?' · '+d.note:''}</span></span><span><a href="/_blob/${d.asset}" target="_blank" rel="noopener">Abrir</a><br><button class="b s" data-a="rev" data-id="${d.id}">${d.reviewed?'Revisado ✓':'Marcar revisado'}</button></span></div>`).join(''):'<p class="mut">Aún no hay archivos de este cuarto.</p>'}
 <label for="d-tipo">Tipo</label><select id="d-tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>
 <label for="d-file">Foto o archivo (imagen o PDF)</label><input id="d-file" type="file" accept="image/*,application/pdf">
 <label for="d-note">Nota (opcional)</label><input id="d-note"><button class="b" data-a="upload">Subir archivo</button>
 <p class="mut">Los comprobantes se asocian al mes que estás viendo (${month}). Los archivos no se borran, para conservar el historial.</p></div>
 <div class="card"><h3>Ficha de la habitación</h3>
 <div class="row"><div><label for="r-status">Estado</label><select id="r-status">${['ocupada','disponible','mantenimiento','reservada'].map(o=>`<option ${r.status==o?'selected':''}>${o}</option>`).join('')}</select></div><div><label for="r-due">Día de vencimiento</label><input id="r-due" type="number" min="1" max="28" value="${r.dueDay}"></div></div>
 <label for="r-name">Inquilino</label><input id="r-name" value="${r.name}"><label for="r-phone">Teléfono</label><input id="r-phone" value="${r.phone}">
 <div class="row"><div><label for="r-canon">Canon mensual</label><input id="r-canon" type="number" step="0.01" value="${r.canon}"></div><div><label for="r-comp">Compensación mensual</label><input id="r-comp" type="number" step="0.01" value="${r.comp}"></div></div>
 <label for="r-g">Garantía acordada</label><input id="r-g" type="number" step="0.01" value="${r.gTotal}"><button class="b" data-a="saveRoom">Guardar ficha</button></div>`}
function render(){const r=view=='home'?null:room(view);$('#app').innerHTML=r?detail(r):home();window.scrollTo(0,0)}
document.addEventListener('change',e=>{if(e.target.dataset.c=='mon'&&e.target.value){month=e.target.value;render()}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,r=view=='home'?null:room(view);
 if(a=='open'){view=+id;return render()}if(a=='back'){view='home';return render()}
 if(a=='backup'){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t);b.textContent='Copiado'}catch(x){b.textContent='No se pudo copiar'}return}
 if(!r)return;
 if(a=='upload'){upload(r,b);return}
 if(a=='rev'){const d=r.docs.find(x=>x.id==id);d.reviewed=!d.reviewed}
 if(a=='saveRoom'){Object.assign(r,{status:v('r-status'),name:v('r-name'),phone:v('r-phone'),canon:+v('r-canon')||0,comp:+v('r-comp')||0,dueDay:Math.min(28,Math.max(1,+v('r-due')||5)),gTotal:+v('r-g')||0})}
 if(a=='addPay'){const m=+v('p-amt');if(!(m>0))return alert('Escribe un monto mayor a cero.');r.pays.push({id:uid(),month,amount:m,date:v('p-date'),method:v('p-method'),note:v('p-note'),state:'revision'})}
 if(a=='verify'){r.pays.find(p=>p.id==id).state='verificado'}
 if(a=='addProm'){const m=+v('q-amt');if(!(m>0)||!v('q-date'))return alert('Indica monto y fecha.');r.proms.push({id:uid(),month,amount:m,date:v('q-date'),status:'pendiente',at:today})}
 if(a=='prom'){r.proms.find(q=>q.id==id).status=b.dataset.st}
 if(a=='addCuota'){const m=+v('c-amt');if(!(m>0)||!v('c-due'))return alert('Indica valor y fecha.');r.cuotas.push({id:uid(),amount:m,due:v('c-due'),paid:null,moves:[]})}
 if(a=='pay'){r.cuotas.find(x=>x.id==id).paid=today}
 if(a=='move'){const d=v('cd-'+id);if(!d)return alert('Elige la nueva fecha.');r.cuotas.find(x=>x.id==id).moves.push({to:d,at:today})}
 save();render()});
render();init();
</script></body></html>
